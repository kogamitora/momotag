name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and publish updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_CONFIG: '{"plugins":{"updater":{"pubkey":"${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}"}}}'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "momotag ${{ github.ref_name }}"
          releaseBody: |
            ## ダウンロード

            お使いの OS に合ったインストーラーを選んでください。

            - **Windows (64-bit):** `.exe` または `.msi`
            - **macOS (Apple Silicon):** `.dmg`
            - **Ubuntu / Debian (64-bit):** `.deb`
            - **Fedora / RPM 系 Linux (64-bit):** `.rpm`
            - **その他の Linux (64-bit):** `.AppImage`

            `.sig` ファイルと `latest.json` は自動更新用です。通常のインストールではダウンロード不要です。

            ## 下载

            请根据操作系统选择安装包：Windows 下载 `.exe` 或 `.msi`；Apple 芯片 Mac 下载 `.dmg`；Ubuntu / Debian 下载 `.deb`；Fedora 等 RPM 系 Linux 下载 `.rpm`；其他 x64 Linux 可使用 `.AppImage`。

            `.sig` 文件和 `latest.json` 用于应用自动更新，手动安装时无需下载。

            ## Download

            Choose the installer for your operating system: Windows (`.exe` or `.msi`), Apple Silicon Mac (`.dmg`), Ubuntu / Debian (`.deb`), Fedora and other RPM-based Linux (`.rpm`), or other x64 Linux (`.AppImage`).

            `.sig` files and `latest.json` are used by the in-app updater and are not needed for manual installation.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
